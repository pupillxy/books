plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.xiaoshuo.xiaoshuo_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.xiaoshuo.xiaoshuo_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        resValue "string", "app_name", "小说阅读"
    }

    buildTypes {
        release {
            // 生产包：包名/名称无后缀。发版走 build_all.ps1（flutter build apk --release）
            signingConfig = signingConfigs.debug
        }
        debug {
            // 测试包（Studio Run 默认即此）：包名 .dev 后缀与生产并排共存，
            // 桌面名"小说阅读 Dev"，versionName 带 -dev。日常开发永远只碰这个包
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "小说阅读 Dev"
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

